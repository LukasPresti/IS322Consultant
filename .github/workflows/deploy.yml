name: Deploy Portfolio

on:
  push:
    branches:
      - main
    paths:
      - 'config.yaml'
      - 'templates/**'
      - 'build_site.py'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2

      - name: Build Site
        run: python build_site.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true # Keep other files like CNAME if present
          exclude_assets: '.github,config.yaml,templates,build_site.py,update_site.py,README.md,requirements.txt'
